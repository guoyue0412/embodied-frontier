name: Verify site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Upload production dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-frontier-dist
          path: dist/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload browser QA artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embodied-frontier-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: warn
          retention-days: 7
